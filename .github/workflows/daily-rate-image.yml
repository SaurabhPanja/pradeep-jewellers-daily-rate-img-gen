name: Generate Daily Gold Rate Image

on:
  schedule:
    # 11:00 AM IST (05:30 UTC) Monday–Saturday
    - cron: '30 5 * * 1-6'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Generate rate image
        run: python generate_rate_image.py

      - name: Commit and push image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gold_rate_card.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update gold rate image [$(date -u +%Y-%m-%d)]"
            git push
          fi
